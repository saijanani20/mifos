version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: mifos_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mifos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurely2026!}
      POSTGRES_DB: ${POSTGRES_DB:-mifos_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: mifos_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mifos.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-ChangePgAdminSecurely2026!}
    ports:
      - "127.0.0.1:5050:80"
    restart: always
    depends_on:
      - postgres

volumes:
  postgres_data:
